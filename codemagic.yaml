workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: sumtagi-appstore
    environment:
      node: 24.20.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.guinea.adventure
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate iOS project
        script: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --workspace ios/gini_app.xcworkspace --scheme gini_app
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
